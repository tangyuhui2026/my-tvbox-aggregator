name: TVBox 自动聚合

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行聚合器
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -X utf8 聚合器.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/tvbox.json

          git diff --cached --quiet || git commit -m "自动更新 TVBox 配置"

          git push
